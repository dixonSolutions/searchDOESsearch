name: Package repositories

# Builds the signed APT and DNF repositories and publishes them as the Pages
# site. Runs on a release tag, on a change to the packaging itself, or by hand.
#
# Requires two repository secrets, created by scripts/bootstrap-signing-key.sh:
#   SDS_GPG_PRIVATE_KEY  armoured private key that signs Release/repomd/the rpm
#   SDS_GPG_KEY_ID       its long key id
#
# Every commit to main republishes, so the site never lags the code; tags and
# manual dispatch publish too. No `paths` filter: it would apply to tag pushes as
# well, where there is no diff to match against, and a tagged release would then
# silently never publish.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.key.outputs.have_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gnome-shell libglib2.0-bin rpm createrepo-c gnupg

      - run: npm ci
      - run: npm run lint

      - name: Build the extension
        run: make build

      - name: Build packages
        run: |
          ./packaging/build-deb.sh
          ./packaging/build-rpm.sh
          ls -l build/packages

      # An ordinary commit to main that cannot be signed should not paint the
      # commit red: it still proves the packages build. A tag or a manual
      # dispatch is someone asking to publish, and that has to fail loudly.
      - name: Import the signing key
        id: key
        env:
          SDS_GPG_PRIVATE_KEY: ${{ secrets.SDS_GPG_PRIVATE_KEY }}
          SDS_GPG_KEY_ID: ${{ secrets.SDS_GPG_KEY_ID }}
        run: |
          if [ -z "$SDS_GPG_PRIVATE_KEY" ]; then
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::notice::No signing key configured — packages built, repositories not published. See docs/PUBLISHING.md § The signing key."
              exit 0
            fi
            echo "::error::SDS_GPG_PRIVATE_KEY is not set, so nothing can be signed. See docs/PUBLISHING.md § The signing key."
            exit 1
          fi
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$SDS_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="${SDS_GPG_KEY_ID:-$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')}"
          if [ -z "$KEY_ID" ]; then
            echo "::error::imported no usable secret key"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SDS_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      - name: Build the signed repositories
        if: steps.key.outputs.have_key == 'true'
        run: ./packaging/build-repos.sh --key "$SDS_KEY_ID" --out build/pages

      - name: Check the published key matches the one in the tree
        if: steps.key.outputs.have_key == 'true'
        run: |
          # A mismatch means the secret was rotated without committing the new
          # public half — users would fetch a key that cannot verify anything.
          a="$(gpg --batch --dearmor < packaging/KEY.gpg | sha256sum | cut -d' ' -f1)"
          b="$(gpg --batch --dearmor < build/pages/KEY.gpg | sha256sum | cut -d' ' -f1)"
          if [ "$a" != "$b" ]; then
            echo "::error::packaging/KEY.gpg does not match the key CI signed with. Re-export it: gpg --armor --export \$KEY_ID > packaging/KEY.gpg"
            exit 1
          fi
          echo "public key in the tree matches the signing key"

      - name: Verify the repositories as a client would
        if: steps.key.outputs.have_key == 'true'
        run: ./packaging/verify-repos.sh --site build/pages

      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.have_key == 'true'
        with:
          path: build/pages

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
